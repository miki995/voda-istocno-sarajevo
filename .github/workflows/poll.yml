name: poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call cron endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl --silent --show-error --max-time 60 --output response.txt --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron")
          cat response.txt
          echo
          test "$status" = "200"
